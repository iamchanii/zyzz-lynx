<!doctype html>
<!-- Hosts one sample's web bundle in a lynx-view sized like a phone screen. The bundle path comes from the `bundle` query parameter. -->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lynx visual comparison</title>
    <link
      rel="stylesheet"
      href="./node_modules/@lynx-js/web-core/dist/client_prod/static/css/client.css"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #fff;
      }
      lynx-view {
        display: block;
        height: 100vh;
        width: 100vw;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import './node_modules/@lynx-js/web-core/dist/client_prod/static/js/client.js'
      const bundle = new URLSearchParams(location.search).get('bundle')
      const view = document.createElement('lynx-view')
      view.setAttribute('url', bundle)
      document.body.append(view)
    </script>
  </body>
</html>
